name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AI-Bootcamp/requirements.txt
          pip install ruff pytest nbformat

      - name: Lint with ruff
        run: ruff check AI-Bootcamp

      - name: Validate Marimo notebooks compile
        run: |
          python -c "
          import pathlib, py_compile
          for f in pathlib.Path('AI-Bootcamp').rglob('*.py'):
              py_compile.compile(str(f), doraise=True)
          print('All notebook/script files compile successfully.')
          "

      - name: Run tests
        run: |
          if [ -d "AI-Bootcamp/tests" ]; then pytest AI-Bootcamp/tests; else echo "No tests directory yet"; fi
